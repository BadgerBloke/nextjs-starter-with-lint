name: CI

on:
    push:
        branches: [trunk]
    pull_request:
        branches: [trunk]

# Husky is skipped in CI (CI=true short-circuits .husky/install.mjs); the gates
# below ARE the enforcement — they can't be bypassed with --no-verify.
env:
    CI: 'true'

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run check-lint

            - name: Format check
              run: bun run check-format

            - name: Type check
              run: bun run check-types

            - name: Test governance (every component has a mirror test)
              run: bun run test:governance

            - name: Unit + component coverage
              run: bun run test:coverage

            - name: Build
              run: bun run build

    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install Playwright browsers
              run: bunx playwright install --with-deps chromium

            - name: Run E2E tests
              run: bun run test:e2e
